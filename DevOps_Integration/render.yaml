services:
  # Database Service
  - type: database
    name: marketmind-db
    databaseName: marketmind_db
    user: postgres

  # FastAPI Backend Service
  - type: web
    name: marketmind-backend
    env: python
    buildCommand: pip install -r Backend_Database/requirements.txt
    startCommand: uvicorn app.main:app --app-dir Backend_Database --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketmind-db
          property: connectionString

  # API Gateway Proxy Service
  - type: web
    name: marketmind-gateway
    env: python
    buildCommand: pip install -r Security_APIGateway/requirements.txt
    startCommand: uvicorn Security_APIGateway.server:app --host 0.0.0.0 --port ${PORT:-5000}
    envVars:
      - key: BACKEND_URL
        value: https://marketmind-backend.onrender.com
      - key: AI_URL
        value: https://marketmind-aiml.onrender.com
      - key: NOTIFICATIONS_URL
        value: https://marketmind-notifications.onrender.com
      - key: JWT_SECRET
        generateValue: true

  # AI/ML Analytics Engine Service
  - type: web
    name: marketmind-aiml
    env: python
    buildCommand: pip install -r AIML/requirements.txt
    startCommand: python AIML/Integrated_API/app.py

  # Streamlit Frontend Web Service
  - type: web
    name: marketmind-frontend
    env: python
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/app.py --server.port ${PORT:-3000} --server.address 0.0.0.0
    envVars:
      - key: BACKEND_URL
        value: https://marketmind-gateway.onrender.com

  # Notifications Microservice
  - type: web
    name: marketmind-notifications
    env: python
    buildCommand: pip install -r DevOps_Integration/notifications/requirements.txt
    startCommand: python DevOps_Integration/notifications/app.py
