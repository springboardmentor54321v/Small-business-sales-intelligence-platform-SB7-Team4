name: MarketMind AI - CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-gateway:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Security_APIGateway/requirements.txt
    - name: Validate Python syntax
      run: |
        python -m py_compile Security_APIGateway/server.py Security_APIGateway/test_gateway.py

  validate-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Backend_Database/requirements.txt
    - name: Validate Python syntax
      run: |
        python -m py_compile Backend_Database/app/main.py

  build-containers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Build API Gateway Container
      uses: docker/build-push-action@v4
      with:
        context: .
        file: DevOps_Integration/gateway.Dockerfile
        push: false
    - name: Build Database Backend Container
      uses: docker/build-push-action@v4
      with:
        context: .
        file: DevOps_Integration/backend.Dockerfile
        push: false
    - name: Build Nginx Frontend Container
      uses: docker/build-push-action@v4
      with:
        context: .
        file: DevOps_Integration/frontend.Dockerfile
        push: false
    - name: Build AIML Forecasting Container
      uses: docker/build-push-action@v4
      with:
        context: .
        file: DevOps_Integration/aiml.Dockerfile
        push: false
