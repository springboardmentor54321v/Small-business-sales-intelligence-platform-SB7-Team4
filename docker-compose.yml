version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: marketmind_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: marketmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: DevOps_Integration/backend.Dockerfile
    container_name: marketmind_backend
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/marketmind_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: DevOps_Integration/gateway.Dockerfile
    container_name: marketmind_gateway
    environment:
      BACKEND_URL: http://backend:8000
      AI_URL: http://aiml:5000
      JWT_SECRET: your_super_secret_jwt_key_12345
      AUDIT_LOG_FILE: /app/logs/audit.log
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - backend
      - aiml

  aiml:
    build:
      context: .
      dockerfile: DevOps_Integration/aiml.Dockerfile
    container_name: marketmind_aiml
    ports:
      - "5002:5000"

  frontend:
    build:
      context: .
      dockerfile: DevOps_Integration/frontend.Dockerfile
    container_name: marketmind_frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
