name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'Backend_Database/**'
      - '.github/workflows/render-backend-deploy.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Backend Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK"
