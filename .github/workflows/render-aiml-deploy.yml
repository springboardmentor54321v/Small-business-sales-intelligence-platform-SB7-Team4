name: Deploy AIML to Render

on:
  push:
    branches:
      - main

jobs:
  deploy-aiml:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render AIML Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_AIML_DEPLOY_HOOK }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK"
