name: MarketMind AI - CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest fastapi uvicorn httpx streamlit bcrypt pyjwt pydantic starlette email-validator sqlalchemy

    - name: Validate Python syntax
      run: |
        python -m compileall -q .

    - name: Run Backend Tests
      run: |
        pytest DevOps_Integration/tests/test_backend_ci.py

    - name: Run Frontend Tests
      run: |
        pytest DevOps_Integration/tests/test_frontend_ci.py

    - name: Run Security Gateway Integration Tests
      run: |
        python Security_APIGateway/test_gateway.py

    - name: Run Security Matrix Audit Scan Tests
      run: |
        python Security_APIGateway/test_security_audit.py

  validate-dockerfiles:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Check API Gateway Dockerfile
      run: docker buildx build --check -f DevOps_Integration/gateway.Dockerfile .
    - name: Check Database Backend Dockerfile
      run: docker buildx build --check -f DevOps_Integration/backend.Dockerfile .
    - name: Check AIML Forecasting Dockerfile
      run: docker buildx build --check -f DevOps_Integration/aiml.Dockerfile .
