# yaml-language-server: $schema=none
name: MarketMind AI - CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AIML/requirements.txt
          pip install -r Backend_Database/requirements.txt
          pip install -r Security_APIGateway/requirements.txt
          pip install -r frontend/requirements.txt
          pip install pytest

      - name: Validate Python syntax
        run: |
          python -m compileall -q .

      - name: Run AIML Engine Tests
        run: |
          python -m unittest AIML/tests/test_realtime_aiml.py

      - name: Run Backend Tests
        run: |
          pytest DevOps_Integration/tests/test_backend_ci.py

      - name: Run Core Backend Database Tests
        run: |
          PYTHONPATH=Backend_Database pytest Backend_Database/tests/

      - name: Run Frontend Tests
        run: |
          pytest DevOps_Integration/tests/test_frontend_ci.py

      - name: Run Security Gateway Integration Tests
        run: |
          PYTHONPATH=Security_APIGateway python Security_APIGateway/test_gateway.py

      - name: Run Security Matrix Audit Scan Tests
        run: |
          PYTHONPATH=Security_APIGateway python Security_APIGateway/test_security_audit.py

  validate-dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check API Gateway Dockerfile
        run: docker buildx build --check -f DevOps_Integration/gateway.Dockerfile .

      - name: Check Database Backend Dockerfile
        run: docker buildx build --check -f DevOps_Integration/backend.Dockerfile .

      - name: Check AIML Forecasting Dockerfile
        run: docker buildx build --check -f DevOps_Integration/aiml.Dockerfile .

      - name: Check Streamlit Frontend Dockerfile
        run: docker buildx build --check -f DevOps_Integration/frontend.Dockerfile .

      - name: Check Notifications Dockerfile
        run: docker buildx build --check -f DevOps_Integration/notifications.Dockerfile .
